<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Review Moderation | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <h1 class="mb-4">Pending Reviews</h1>

    <div th:if="${#lists.isEmpty(reviews)}"
         class="empty-state">
        There are no pending reviews.
    </div>

    <div class="review-card"
         th:each="review : ${reviews}">

        <div class="d-flex justify-content-between">
            <div>
                <h3 th:text="${review.perfumeName}"></h3>

                <p>
                    By
                    <strong th:text="${review.username}"></strong>
                    ·
                    <span th:text="${review.rating + '/5'}"></span>
                </p>
            </div>
        </div>

        <p th:text="${review.content}"></p>

        <div class="d-flex gap-2">

            <form th:action="@{/admin/reviews/{id}/approve(id=${review.id})}"
                  method="post">

                <button class="btn btn-success">
                    Approve
                </button>
            </form>

            <form th:action="@{/admin/reviews/{id}/reject(id=${review.id})}"
                  method="post">

                <button class="btn btn-danger">
                    Reject
                </button>
            </form>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
