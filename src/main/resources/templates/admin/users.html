<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Users | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <h1 class="mb-4">Manage Users</h1>

    <div class="table-responsive">

        <table class="table custom-table align-middle">

            <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Name</th>
                <th>Role</th>
                <th>Enabled</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="user : ${users}">

                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>

                <td th:text="${user.firstName + ' ' + user.lastName}">
                </td>

                <td th:text="${user.role}"></td>
                <td th:text="${user.enabled ? 'Yes' : 'No'}"></td>

                <td>
                    <div class="d-flex flex-wrap gap-2">

                        <form th:action="@{/admin/users/{id}/role(id=${user.id})}"
                              method="post">

                            <select name="role"
                                    class="form-select form-select-sm d-inline-block admin-role-select">

                                <option value="USER"
                                        th:selected="${user.role.name() == 'USER'}">
                                    USER
                                </option>

                                <option value="ADMIN"
                                        th:selected="${user.role.name() == 'ADMIN'}">
                                    ADMIN
                                </option>
                            </select>

                            <button class="btn btn-outline-dark btn-sm">
                                Update Role
                            </button>
                        </form>

                        <form th:action="@{/admin/users/{id}/enabled(id=${user.id})}"
                              method="post">

                            <button class="btn btn-outline-secondary btn-sm"
                                    th:text="${user.enabled
                                        ? 'Disable'
                                        : 'Enable'}">
                            </button>
                        </form>

                    </div>
                </td>

            </tr>
            </tbody>
        </table>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
