<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Manage Orders | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-5">
    <h1 class="mb-4">Manage Orders</h1>

    <div th:if="${param.updated}"
         class="alert alert-success">
        Order status updated successfully.
    </div>

    <div th:if="${#lists.isEmpty(orders)}"
         class="empty-state">
        There are no orders.
    </div>

    <div class="table-responsive"
         th:unless="${#lists.isEmpty(orders)}">

        <table class="table custom-table align-middle">
            <thead>
            <tr>
                <th>Customer</th>
                <th>Perfume</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Address</th>
                <th>Created</th>
                <th>Current Status</th>
                <th>Update Status</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.customerUsername}">
                    Customer
                </td>

                <td>
                    <div class="table-product">
                        <img th:src="${order.perfumeImageUrl}"
                             th:alt="${order.perfumeName}">

                        <span th:text="${order.perfumeName}">
                            Perfume
                        </span>
                    </div>
                </td>

                <td th:text="${order.quantity}">
                    1
                </td>

                <td>
                    €<span th:text="${order.totalPrice}">
                        100.00
                    </span>
                </td>

                <td th:text="${order.deliveryAddress}">
                    Address
                </td>

                <td th:text="${#temporals.format(
                    order.createdAt,
                    'dd MMM yyyy HH:mm'
                )}">
                    Date
                </td>

                <td>
                    <span class="status-badge"
                          th:classappend="${
                            ' status-' +
                            #strings.toLowerCase(order.status.name())
                          }"
                          th:text="${order.status}">
                        PENDING
                    </span>
                </td>

                <td>
                    <form th:action="@{/admin/orders/{id}/status(id=${order.id})}"
                          method="post">

                        <select name="status"
                                class="form-select form-select-sm">
                            <option value="PENDING"
                                    th:selected="${order.status.name() == 'PENDING'}">
                                PENDING
                            </option>

                            <option value="PROCESSING"
                                    th:selected="${order.status.name() == 'PROCESSING'}">
                                PROCESSING
                            </option>

                            <option value="COMPLETED"
                                    th:selected="${order.status.name() == 'COMPLETED'}">
                                COMPLETED
                            </option>

                            <option value="CANCELLED"
                                    th:selected="${order.status.name() == 'CANCELLED'}">
                                CANCELLED
                            </option>
                        </select>

                        <button type="submit"
                                class="btn btn-dark btn-sm mt-2">
                            Update
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
