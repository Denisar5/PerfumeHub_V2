<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | PerfumeHub</title>
</head>

<body>

<main>
    <h1>Create account</h1>

    <form th:action="@{/register}"
          th:object="${registerDto}"
          method="post">

        <div th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}"
               th:text="${error}"
               style="color: red;">
                Registration error
            </p>
        </div>

        <div>
            <label for="username">Username</label>

            <input id="username"
                   type="text"
                   th:field="*{username}">

            <p th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}"
               style="color: red;">
                Username error
            </p>
        </div>

        <div>
            <label for="email">Email</label>

            <input id="email"
                   type="email"
                   th:field="*{email}">

            <p th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"
               style="color: red;">
                Email error
            </p>
        </div>

        <div>
            <label for="firstName">First name</label>

            <input id="firstName"
                   type="text"
                   th:field="*{firstName}">

            <p th:if="${#fields.hasErrors('firstName')}"
               th:errors="*{firstName}"
               style="color: red;">
                First name error
            </p>
        </div>

        <div>
            <label for="lastName">Last name</label>

            <input id="lastName"
                   type="text"
                   th:field="*{lastName}">

            <p th:if="${#fields.hasErrors('lastName')}"
               th:errors="*{lastName}"
               style="color: red;">
                Last name error
            </p>
        </div>

        <div>
            <label for="password">Password</label>

            <input id="password"
                   type="password"
                   th:field="*{password}">

            <p th:if="${#fields.hasErrors('password')}"
               th:errors="*{password}"
               style="color: red;">
                Password error
            </p>
        </div>

        <div>
            <label for="confirmPassword">
                Confirm password
            </label>

            <input id="confirmPassword"
                   type="password"
                   th:field="*{confirmPassword}">

            <p th:if="${#fields.hasErrors('confirmPassword')}"
               th:errors="*{confirmPassword}"
               style="color: red;">
                Password confirmation error
            </p>
        </div>

        <button type="submit">
            Register
        </button>
    </form>

    <p>
        Already registered?
        <a th:href="@{/login}">Login</a>
    </p>
</main>

</body>
</html>
