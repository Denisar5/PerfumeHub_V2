<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Register | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-5">
    <div class="form-card">
        <div class="text-center mb-4">
            <p class="form-eyebrow">JOIN PERFUMEHUB</p>
            <h1>Create Account</h1>
        </div>

        <form th:action="@{/register}"
              th:object="${registerDto}"
              method="post">

            <div th:if="${#fields.hasGlobalErrors()}"
                 class="alert alert-danger">

                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}"
                   class="mb-0">
                    Registration error
                </p>
            </div>

            <div class="mb-3">
                <label for="username"
                       class="form-label">
                    Username
                </label>

                <input id="username"
                       type="text"
                       th:field="*{username}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{username}">
                </p>
            </div>

            <div class="mb-3">
                <label for="email"
                       class="form-label">
                    Email
                </label>

                <input id="email"
                       type="email"
                       th:field="*{email}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{email}">
                </p>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstName"
                           class="form-label">
                        First Name
                    </label>

                    <input id="firstName"
                           type="text"
                           th:field="*{firstName}"
                           class="form-control">

                    <p class="validation-error"
                       th:errors="*{firstName}">
                    </p>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="lastName"
                           class="form-label">
                        Last Name
                    </label>

                    <input id="lastName"
                           type="text"
                           th:field="*{lastName}"
                           class="form-control">

                    <p class="validation-error"
                       th:errors="*{lastName}">
                    </p>
                </div>
            </div>

            <div class="mb-3">
                <label for="password"
                       class="form-label">
                    Password
                </label>

                <input id="password"
                       type="password"
                       th:field="*{password}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{password}">
                </p>
            </div>

            <div class="mb-4">
                <label for="confirmPassword"
                       class="form-label">
                    Confirm Password
                </label>

                <input id="confirmPassword"
                       type="password"
                       th:field="*{confirmPassword}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{confirmPassword}">
                </p>
            </div>

            <button type="submit"
                    class="btn btn-dark w-100">
                Register
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Already registered?
            <a th:href="@{/login}">
                Login here
            </a>
        </p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
