<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Reviews | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-5">

    <h1 class="mb-4">My Reviews</h1>

    <div th:if="${param.updated}"
         class="alert alert-success">
        Review updated and submitted for approval.
    </div>

    <div th:if="${param.deleted}"
         class="alert alert-success">
        Review deleted.
    </div>

    <div th:if="${#lists.isEmpty(reviews)}"
         class="empty-state">
        You have not written any reviews yet.
    </div>

    <div class="review-card"
         th:each="review : ${reviews}">

        <div class="d-flex justify-content-between">
            <div>
                <h3 th:text="${review.perfumeName}">
                    Perfume
                </h3>

                <span class="rating"
                      th:text="${review.rating + '/5'}">
                    5/5
                </span>
            </div>

            <span class="status-badge"
                  th:classappend="${review.approved
                    ? ' status-completed'
                    : ' status-pending'}"
                  th:text="${review.approved
                    ? 'APPROVED'
                    : 'PENDING'}">
            </span>
        </div>

        <p th:text="${review.content}">
            Review content
        </p>

        <div class="d-flex gap-2">

            <a th:href="@{/reviews/{id}/edit(id=${review.id})}"
               class="btn btn-outline-dark btn-sm">
                Edit
            </a>

            <form th:action="@{/reviews/{id}/delete(id=${review.id})}"
                  method="post">

                <button type="submit"
                        class="btn btn-outline-danger btn-sm">
                    Delete
                </button>
            </form>
        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
