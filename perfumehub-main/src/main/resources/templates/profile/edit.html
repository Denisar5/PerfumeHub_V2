<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-5">

    <div class="form-card">

        <h1 class="mb-4">Edit Profile</h1>

        <form th:action="@{/profile/edit}"
              th:object="${profileEditDto}"
              method="post">

            <div class="mb-3">
                <label class="form-label">Email</label>

                <input type="email"
                       th:field="*{email}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{email}">
                </p>
            </div>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        First name
                    </label>

                    <input type="text"
                           th:field="*{firstName}"
                           class="form-control">

                    <p class="validation-error"
                       th:errors="*{firstName}">
                    </p>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">
                        Last name
                    </label>

                    <input type="text"
                           th:field="*{lastName}"
                           class="form-control">

                    <p class="validation-error"
                       th:errors="*{lastName}">
                    </p>
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">
                    Phone number
                </label>

                <input type="text"
                       th:field="*{phoneNumber}"
                       class="form-control">
            </div>

            <div class="mb-4">
                <label class="form-label">Address</label>

                <input type="text"
                       th:field="*{address}"
                       class="form-control">
            </div>

            <div class="d-flex gap-2">
                <button type="submit"
                        class="btn btn-dark">
                    Save Changes
                </button>

                <a th:href="@{/profile}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
