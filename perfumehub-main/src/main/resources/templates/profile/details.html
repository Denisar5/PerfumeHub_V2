<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Profile | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-xl-7 col-lg-8 col-md-10">

            <div class="profile-card">

                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <p class="form-eyebrow">ACCOUNT</p>
                        <h1>My Profile</h1>
                    </div>

                    <a th:href="@{/profile/edit}"
                       class="btn btn-dark">
                        Edit Profile
                    </a>
                </div>

                <dl class="row profile-data">

                    <dt class="col-sm-4">Username</dt>
                    <dd class="col-sm-8"
                        th:text="${user.username}">
                        username
                    </dd>

                    <dt class="col-sm-4">Email</dt>
                    <dd class="col-sm-8"
                        th:text="${user.email}">
                        email
                    </dd>

                    <dt class="col-sm-4">Name</dt>
                    <dd class="col-sm-8"
                        th:text="${user.firstName + ' ' + user.lastName}">
                        Full Name
                    </dd>

                    <dt class="col-sm-4">Phone</dt>
                    <dd class="col-sm-8"
                        th:text="${user.phoneNumber != null ? user.phoneNumber : 'Not provided'}">
                        Phone
                    </dd>

                    <dt class="col-sm-4">Address</dt>
                    <dd class="col-sm-8"
                        th:text="${user.address != null ? user.address : 'Not provided'}">
                        Address
                    </dd>

                    <dt class="col-sm-4">Role</dt>
                    <dd class="col-sm-8"
                        th:text="${user.role}">
                        USER
                    </dd>

                </dl>

            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
