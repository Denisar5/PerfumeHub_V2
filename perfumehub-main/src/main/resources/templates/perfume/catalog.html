<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Perfume Catalog | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-5">

    <div class="section-heading text-start mb-4">
        <p>OUR COLLECTION</p>
        <h1>Perfume Catalog</h1>
    </div>

    <!-- FILTERS -->

    <section class="catalog-filter-card mb-5">

        <form th:action="@{/perfumes}"
              th:object="${searchDto}"
              method="get">

            <div class="row g-3">

                <!-- SEARCH -->

                <div class="col-lg-4">

                    <label for="search"
                           class="form-label">
                        Search
                    </label>

                    <input id="search"
                           type="text"
                           th:field="*{search}"
                           class="form-control"
                           placeholder="Search perfume or brand">

                </div>

                <!-- BRAND -->

                <div class="col-md-6 col-lg-2">

                    <label for="brand"
                           class="form-label">
                        Brand
                    </label>

                    <select id="brand"
                            th:field="*{brand}"
                            class="form-select">

                        <option value="">
                            All brands
                        </option>

                        <option th:each="brand : ${brands}"
                                th:value="${brand}"
                                th:text="${brand}">
                            Dior
                        </option>

                    </select>

                </div>

                <!-- GENDER -->

                <div class="col-md-6 col-lg-2">

                    <label for="gender"
                           class="form-label">
                        Gender
                    </label>

                    <select id="gender"
                            th:field="*{gender}"
                            class="form-select">

                        <option value="">
                            All
                        </option>

                        <option th:each="gender : ${genders}"
                                th:value="${gender}"
                                th:text="${gender}">
                            MALE
                        </option>

                    </select>

                </div>

                <!-- MIN PRICE -->

                <div class="col-md-6 col-lg-2">

                    <label for="minPrice"
                           class="form-label">
                        Min price
                    </label>

                    <input id="minPrice"
                           type="number"
                           step="0.01"
                           min="0"
                           th:field="*{minPrice}"
                           class="form-control">

                </div>

                <!-- MAX PRICE -->

                <div class="col-md-6 col-lg-2">

                    <label for="maxPrice"
                           class="form-label">
                        Max price
                    </label>

                    <input id="maxPrice"
                           type="number"
                           step="0.01"
                           min="0"
                           th:field="*{maxPrice}"
                           class="form-control">

                </div>

            </div>

            <div class="row g-3 mt-1">

                <div class="col-md-4">

                    <label for="sort"
                           class="form-label">
                        Sort
                    </label>

                    <select id="sort"
                            th:field="*{sort}"
                            class="form-select">

                        <option value="newest">
                            Newest
                        </option>

                        <option value="priceAsc">
                            Price: Low to High
                        </option>

                        <option value="priceDesc">
                            Price: High to Low
                        </option>

                        <option value="nameAsc">
                            Name: A-Z
                        </option>

                        <option value="nameDesc">
                            Name: Z-A
                        </option>

                    </select>

                </div>

                <div class="col-md-8 d-flex align-items-end gap-2">

                    <button type="submit"
                            class="btn btn-dark">
                        Apply Filters
                    </button>

                    <a th:href="@{/perfumes}"
                       class="btn btn-outline-secondary">
                        Reset
                    </a>

                </div>

            </div>

        </form>

    </section>

    <!-- RESULT COUNT -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <p class="text-muted mb-0">

            <strong th:text="${perfumePage.totalElements}">
                0
            </strong>

            perfumes found

        </p>

        <p class="text-muted mb-0"
           th:if="${perfumePage.totalPages > 0}">

            Page

            <span th:text="${perfumePage.number + 1}">
                1
            </span>

            of

            <span th:text="${perfumePage.totalPages}">
                1
            </span>

        </p>

    </div>

    <!-- EMPTY STATE -->

    <div th:if="${#lists.isEmpty(perfumes)}"
         class="empty-state">

        <h3>No perfumes match your filters.</h3>

        <p>
            Try changing the search or filter options.
        </p>

        <a th:href="@{/perfumes}"
           class="btn btn-dark mt-2">
            Reset Filters
        </a>

    </div>

    <!-- CATALOG -->

    <div class="row g-4"
         th:unless="${#lists.isEmpty(perfumes)}">

        <div class="col-sm-6 col-lg-4 col-xl-3"
             th:each="perfume : ${perfumes}">

            <article class="product-card">

                <a th:href="@{/perfumes/{id}(id=${perfume.id})}">

                    <img th:src="${perfume.imageUrl}"
                         th:alt="${perfume.name}"
                         class="product-image">

                </a>

                <div class="product-content">

                    <p class="product-brand"
                       th:text="${perfume.brand}">
                        Brand
                    </p>

                    <h2 class="product-title">

                        <a th:href="@{/perfumes/{id}(id=${perfume.id})}"
                           th:text="${perfume.name}">
                            Perfume
                        </a>

                    </h2>

                    <p class="product-meta">

                        <span th:text="${perfume.volumeMl}">
                            100
                        </span>

                        ml ·

                        <span th:text="${perfume.gender}">
                            MALE
                        </span>

                    </p>

                    <div class="d-flex justify-content-between align-items-center">

                        <span class="product-price">

                            €<span th:text="${#numbers.formatDecimal(
                                    perfume.price,
                                    1,
                                    2
                            )}">
                                99.99
                            </span>

                        </span>

                        <span th:if="${perfume.stockQuantity > 0}"
                              class="stock available">
                            In stock
                        </span>

                        <span th:unless="${perfume.stockQuantity > 0}"
                              class="stock unavailable">
                            Out of stock
                        </span>

                    </div>

                    <a th:href="@{/perfumes/{id}(id=${perfume.id})}"
                       class="btn btn-outline-dark w-100 mt-3">

                        View Details

                    </a>

                </div>

            </article>

        </div>

    </div>

    <!-- PAGINATION -->

    <nav th:if="${perfumePage.totalPages > 1}"
         class="mt-5"
         aria-label="Perfume catalog pages">

        <ul class="pagination justify-content-center">

            <!-- PREVIOUS -->

            <li class="page-item"
                th:classappend="${perfumePage.first} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/perfumes(
                        search=${searchDto.search},
                        brand=${searchDto.brand},
                        gender=${searchDto.gender},
                        minPrice=${searchDto.minPrice},
                        maxPrice=${searchDto.maxPrice},
                        sort=${searchDto.sort},
                        page=${perfumePage.number - 1}
                   )}">
                    Previous
                </a>

            </li>

            <!-- PAGE NUMBERS -->

            <li class="page-item"
                th:each="pageNumber : ${#numbers.sequence(
                    0,
                    perfumePage.totalPages - 1
                )}"
                th:classappend="${pageNumber == perfumePage.number} ? 'active'">

                <a class="page-link"
                   th:text="${pageNumber + 1}"
                   th:href="@{/perfumes(
                        search=${searchDto.search},
                        brand=${searchDto.brand},
                        gender=${searchDto.gender},
                        minPrice=${searchDto.minPrice},
                        maxPrice=${searchDto.maxPrice},
                        sort=${searchDto.sort},
                        page=${pageNumber}
                   )}">
                    1
                </a>

            </li>

            <!-- NEXT -->

            <li class="page-item"
                th:classappend="${perfumePage.last} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/perfumes(
                        search=${searchDto.search},
                        brand=${searchDto.brand},
                        gender=${searchDto.gender},
                        minPrice=${searchDto.minPrice},
                        maxPrice=${searchDto.maxPrice},
                        sort=${searchDto.sort},
                        page=${perfumePage.number + 1}
                   )}">
                    Next
                </a>

            </li>

        </ul>

    </nav>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
