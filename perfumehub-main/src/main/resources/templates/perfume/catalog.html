<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Perfume Catalog | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-5">

    <div class="section-heading text-start mb-4">
        <p>OUR COLLECTION</p>
        <h1>Perfume Catalog</h1>
    </div>

    <div th:if="${#lists.isEmpty(perfumes)}"
         class="empty-state">

        <h3>No perfumes are currently available.</h3>
        <p>Please check again later.</p>
    </div>

    <div class="row g-4"
         th:unless="${#lists.isEmpty(perfumes)}">

        <div class="col-sm-6 col-lg-4 col-xl-3"
             th:each="perfume : ${perfumes}">

            <article class="product-card">

                <a th:href="@{/perfumes/{id}(id=${perfume.id})}">
                    <img th:src="${perfume.imageUrl}"
                         th:alt="${perfume.name}"
                         class="product-image">
                </a>

                <div class="product-content">

                    <p class="product-brand"
                       th:text="${perfume.brand}">
                        Brand
                    </p>

                    <h2 class="product-title">
                        <a th:href="@{/perfumes/{id}(id=${perfume.id})}"
                           th:text="${perfume.name}">
                            Perfume Name
                        </a>
                    </h2>

                    <p class="product-meta">
                        <span th:text="${perfume.volumeMl}">
                            100
                        </span>
                        ml ·
                        <span th:text="${perfume.gender}">
                            UNISEX
                        </span>
                    </p>

                    <div class="d-flex justify-content-between align-items-center">

                        <span class="product-price">
                            €<span th:text="${perfume.price}">
                                99.99
                            </span>
                        </span>

                        <span th:if="${perfume.stockQuantity > 0}"
                              class="stock available">
                            In stock
                        </span>

                        <span th:unless="${perfume.stockQuantity > 0}"
                              class="stock unavailable">
                            Out of stock
                        </span>

                    </div>

                    <a th:href="@{/perfumes/{id}(id=${perfume.id})}"
                       class="btn btn-outline-dark w-100 mt-3">
                        View Details
                    </a>

                </div>
            </article>
        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
