<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Perfumes | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}"
          rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Manage Perfumes</h1>

        <a th:href="@{/admin/perfumes/create}"
           class="btn btn-dark">
            Add Perfume
        </a>
    </div>

    <div class="table-responsive">

        <table class="table custom-table align-middle">
            <thead>
            <tr>
                <th>Name</th>
                <th>Brand</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Visible</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="perfume : ${perfumes}">

                <td th:text="${perfume.name}"></td>
                <td th:text="${perfume.brand}"></td>

                <td>
                    €<span th:text="${perfume.price}"></span>
                </td>

                <td th:text="${perfume.stockQuantity}"></td>

                <td th:text="${perfume.visible ? 'Yes' : 'No'}">
                </td>

                <td>
                    <div class="d-flex flex-wrap gap-2">

                        <a th:href="@{/admin/perfumes/{id}/edit(id=${perfume.id})}"
                           class="btn btn-outline-dark btn-sm">
                            Edit
                        </a>

                        <form th:action="@{/admin/perfumes/{id}/visibility(id=${perfume.id})}"
                              method="post">

                            <button class="btn btn-outline-secondary btn-sm">
                                Toggle Visibility
                            </button>
                        </form>

                        <form th:action="@{/admin/perfumes/{id}/delete(id=${perfume.id})}"
                              method="post">

                            <button class="btn btn-outline-danger btn-sm">
                                Delete
                            </button>
                        </form>

                    </div>
                </td>

            </tr>
            </tbody>
        </table>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
