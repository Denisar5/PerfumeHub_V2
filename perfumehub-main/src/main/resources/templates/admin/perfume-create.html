<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Create Perfume | PerfumeHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 py-5">
    <div class="form-card">
        <h1 class="mb-4">Add Perfume</h1>

        <form th:action="@{/admin/perfumes/create}"
              th:object="${perfumeCreateDto}"
              method="post">

            <div class="mb-3">
                <label for="name"
                       class="form-label">
                    Name
                </label>

                <input id="name"
                       type="text"
                       th:field="*{name}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{name}">
                </p>
            </div>

            <div class="mb-3">
                <label for="brand"
                       class="form-label">
                    Brand
                </label>

                <input id="brand"
                       type="text"
                       th:field="*{brand}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{brand}">
                </p>
            </div>

            <div class="mb-3">
                <label for="description"
                       class="form-label">
                    Description
                </label>

                <textarea id="description"
                          th:field="*{description}"
                          rows="5"
                          class="form-control">
                </textarea>

                <p class="validation-error"
                   th:errors="*{description}">
                </p>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="price"
                           class="form-label">
                        Price
                    </label>

                    <input id="price"
                           type="number"
                           step="0.01"
                           min="0.01"
                           th:field="*{price}"
                           class="form-control">

                    <p class="validation-error"
                       th:errors="*{price}">
                    </p>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="gender"
                           class="form-label">
                        Gender
                    </label>

                    <select id="gender"
                            th:field="*{gender}"
                            class="form-select">
                        <option value="">
                            Select gender
                        </option>

                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="UNISEX">Unisex</option>
                    </select>

                    <p class="validation-error"
                       th:errors="*{gender}">
                    </p>
                </div>
            </div>

            <div class="mb-3">
                <label for="imageUrl"
                       class="form-label">
                    Image URL
                </label>

                <input id="imageUrl"
                       type="url"
                       th:field="*{imageUrl}"
                       class="form-control">

                <p class="validation-error"
                   th:errors="*{imageUrl}">
                </p>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="volumeMl"
                           class="form-label">
                        Volume in ml
                    </label>

                    <input id="volumeMl"
                           type="number"
                           min="10"
                           max="1000"
                           th:field="*{volumeMl}"
                           class="form-control">

                    <p class="validation-error"
                       th:errors="*{volumeMl}">
                    </p>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="stockQuantity"
                           class="form-label">
                        Stock Quantity
                    </label>

                    <input id="stockQuantity"
                           type="number"
                           min="0"
                           th:field="*{stockQuantity}"
                           class="form-control">

                    <p class="validation-error"
                       th:errors="*{stockQuantity}">
                    </p>
                </div>
            </div>

            <div class="form-check mb-4">
                <input id="visible"
                       type="checkbox"
                       th:field="*{visible}"
                       class="form-check-input">

                <label for="visible"
                       class="form-check-label">
                    Visible in catalog
                </label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit"
                        class="btn btn-dark">
                    Create Perfume
                </button>

                <a th:href="@{/admin/perfumes}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
